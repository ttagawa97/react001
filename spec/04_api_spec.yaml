# =============================================================================
# IoT Platform API Specification
# =============================================================================
#
# File Name:
#   04_api_spec.yaml
#
# Purpose:
#   IoTプラットフォームのREST API仕様、
#   デバイス受信API、認証API、管理API、
#   Request/Response形式、権限制御を定義する。
#
# Spec Version:
#   2.1.0
#
# Last Updated:
#   2026-06-15
#
# Authoring Agent:
#   OpenAI GPT-5.5
#
# =============================================================================

api_spec:

  # ===========================================================================
  # 01. METADATA
  # ===========================================================================

  metadata:
    system_name: iot_platform
    spec_version: 2.1.0
    document_type: api_specification
    base_path: /api/v1

  # ===========================================================================
  # 02. COMMON API RULES
  # ===========================================================================

  common:
    response_format: json

    frontend_client:
      implementation: browser_fetch
      base_path_env: VITE_API_BASE_PATH
      default_base_path: /api/v1
      credentials: include
      authorization_header: Bearer {session_token}
      token_storage: sessionStorage.iot_platform_auth_token
      success_payload_unwrap: dataが存在する場合はdataを返し、存在しない場合はレスポンス本体を返す
      accepted_list_shapes:
        - array
        - data_array
        - results
        - items
        - named_collection

    success_response:
      success: true
      data: object_or_array

    error_response:
      success: false
      error:
        code: string
        message: string
        details: optional

    authorization:
      required_for_client_api: true
      rule: ログインユーザーの権限範囲で必ず参照・更新対象を制限する

    request_key_policy:
      foreign_key_body_fields:
        rule: 管理APIのrequest bodyで外部キーを送信する場合は、Django REST Framework serializerの入力名に合わせる
        site_company_field: company
        user_company_field: company
        user_site_field: site
        device_company_field: company
        device_site_field: site
        threshold_company_field: company
        threshold_site_field: site
        threshold_device_field: device
        note: company_id / site_id はDB項目名、URL path parameter、query parameterで使う。request bodyの外部キー入力名には使わない。

  # ===========================================================================
  # 03. AUTH API
  # ===========================================================================

  auth_api:
    - id: login
      method: POST
      path: /auth/login
      request:
        login_id: string
        password: string
      response:
        token: string
        user:
          id: integer_or_string
          login_id: string
          user_name: string
          role: system_admin_or_company_admin_or_site_admin_or_general_user
          company_id: nullable_integer_or_string
          site_id: nullable_integer_or_string
      client_behavior:
        - store token in sessionStorage
        - store user object in sessionStorage.iot_platform_auth_user
        - restore both values on browser reload

    - id: logout
      method: POST
      path: /auth/logout
      client_behavior: API成否にかかわらず保存済みtokenとuserを削除する

    - id: password_reset_request
      method: POST
      path: /auth/password-reset/request

    - id: password_reset_execute
      method: POST
      path: /auth/password-reset/execute
      request:
        login_id: string
        new_password: string
      ui_usage: 現在のパスワード再設定画面が直接使用する

  # ===========================================================================
  # 04. DEVICE RECEIVE API
  # ===========================================================================

  device_receive_api:
    id: receive_device_data
    method: POST
    path: /data
    full_path: /api/v1/data
    protocol: HTTPS
    auth: basic_auth
    request_format:
      - application/json
      - text/csv

    authentication:
      type: basic_auth
      username: device.auth_id
      password: device.auth_password

    response:
      status: 202
      fields:
        accepted: boolean
        raw_data_id: integer
        device_id: string
        stored_values: integer
        received_at: datetime

    environment_implementation:
      development:
        status: implemented
        runtime: django_rest_framework
        api_location: same_backend_api
        database: sqlite
        processing: synchronous
        behavior:
          - authenticate_device
          - identify_device
          - store_raw_data
          - parse_and_validate_data
          - store_parsed_data
          - update_latest_value
          - update_device_status
          - return_accepted_response
      production:
        status: pending
        runtime: aws_lambda
        database: timescaledb
        processing: pending
        note: AWS Lambda用プログラムおよびTimescaleDB書き込み処理は本改修の対象外とする。

    error_policy:
      invalid_data: accept_and_record
      parse_error: accept_and_record
      auth_error: reject

  # ===========================================================================
  # 05. COMPANY API
  # ===========================================================================

  company_api:
    - id: list_companies
      method: GET
      path: /companies
      allowed_roles:
        - system_admin

    - id: create_company
      method: POST
      path: /companies
      allowed_roles:
        - system_admin
      request:
        name: string
        status: active_or_inactive

    - id: update_company
      method: PUT
      path: /companies/{company_id}
      allowed_roles:
        - system_admin

    - id: disable_company
      method: POST
      path: /companies/{company_id}/disable
      allowed_roles:
        - system_admin

  # ===========================================================================
  # 06. SITE API
  # ===========================================================================

  site_api:
    - id: list_sites
      method: GET
      path: /sites
      allowed_roles:
        - system_admin
        - company_admin
        - site_admin
        - general_user
      query:
        company_id: optional_integer
        site_id: optional_integer
      response:
        id: integer
        company: integer
        company_name: string
        site_name: string
        address: string
        status: active_or_inactive
        created_at: datetime
        updated_at: datetime

    - id: create_site
      method: POST
      path: /sites
      allowed_roles:
        - system_admin
        - company_admin
      request:
        company: integer
        site_name: string
        address: optional_string
      response:
        id: integer
        company: integer
        company_name: string
        site_name: string
        address: string
        status: active_or_inactive
        created_at: datetime
        updated_at: datetime

    - id: update_site
      method: PUT
      path: /sites/{site_id}
      allowed_roles:
        - system_admin
        - company_admin
      path_params:
        site_id: integer
      request:
        company: integer
        site_name: string
        address: optional_string
        status: optional_active_or_inactive
      response:
        id: integer
        company: integer
        company_name: string
        site_name: string
        address: string
        status: active_or_inactive
        created_at: datetime
        updated_at: datetime

    - id: disable_site
      method: POST
      path: /sites/{site_id}/disable
      allowed_roles:
        - system_admin
        - company_admin
      path_params:
        site_id: integer

  # ===========================================================================
  # 07. USER API
  # ===========================================================================

  user_api:
    - id: list_users
      method: GET
      path: /users
      allowed_roles:
        - system_admin
        - company_admin
        - site_admin
      query:
        company_id: optional_integer
        site_id: optional_integer
      query_rule:
        site_id_selection_requires_company_scope: true
        system_admin_users_visible_only_when_company_id_and_site_id_are_omitted: true
      response:
        id: integer
        company: nullable_integer
        site: nullable_integer
        role: system_admin_or_company_admin_or_site_admin_or_general_user
        login_id: string
        user_name: string
        status: active_or_inactive
        created_at: datetime
        updated_at: datetime

    - id: create_user
      method: POST
      path: /users
      allowed_roles:
        - system_admin
        - company_admin
        - site_admin
      request:
        company: nullable_integer
        site: nullable_integer
        role: system_admin_or_company_admin_or_site_admin_or_general_user
        login_id: string
        user_name: string
        password: string
        status: active_or_inactive
      response:
        id: integer
        company: nullable_integer
        site: nullable_integer
        role: system_admin_or_company_admin_or_site_admin_or_general_user
        login_id: string
        user_name: string
        status: active_or_inactive
        created_at: datetime
        updated_at: datetime

    - id: update_user
      method: PUT
      path: /users/{user_id}
      allowed_roles:
        - system_admin
        - company_admin
        - site_admin
      path_params:
        user_id: integer
      request:
        company: nullable_integer
        site: nullable_integer
        role: system_admin_or_company_admin_or_site_admin_or_general_user
        user_name: string
        password: optional_string
        status: active_or_inactive
      immutable_fields:
        - login_id
      response:
        id: integer
        company: nullable_integer
        site: nullable_integer
        role: system_admin_or_company_admin_or_site_admin_or_general_user
        login_id: string
        user_name: string
        status: active_or_inactive
        created_at: datetime
        updated_at: datetime

    - id: reset_user_password
      method: POST
      path: /users/{user_id}/reset-password
      allowed_roles:
        - system_admin
        - company_admin
        - site_admin
      path_params:
        user_id: integer

  # ===========================================================================
  # 08. DEVICE API
  # ===========================================================================

  device_api:
    - id: list_devices
      method: GET
      path: /devices
      allowed_roles:
        - system_admin
        - company_admin
        - site_admin
        - general_user
      query:
        company_id: optional_integer
        site_id: optional_integer
      response:
        id: integer
        company: integer
        company_name: string
        site: integer
        site_name: string
        device_id: string
        device_name: string
        auth_id: string
        input_type: json_or_csv
        csv_header_mode: header_exists_or_no_header
        status: active_or_inactive
        columns:
          - id: integer
            device: integer
            column_name: string
            display_name: string
            data_type: number_or_string_or_boolean
            unit: string
            weight: decimal_string
            display_order: integer
        created_at: datetime
        updated_at: datetime

    - id: list_latest_devices
      method: GET
      path: /devices/latest
      allowed_roles:
        - system_admin
        - company_admin
        - site_admin
        - general_user
      purpose: 最新値一覧表示用の軽量レスポンス。デバイスのカラム定義は含めない。
      usage_note: デバイス設定・閾値設定などカラム定義が必要な画面は GET /devices を使用する。
      query:
        company_id: optional_integer
        site_id: optional_integer
      response:
        id: integer
        company_name: string
        site_name: string
        device_id: string
        device_name: string
        latest_values:
          - column_name: string
            display_name: string
            unit: string
            raw_value: number_or_string_or_boolean
            display_value: number_or_string_or_boolean
        latest_received_at: nullable_datetime
        estimated_interval_seconds: nullable_number
        communication_status: online_or_offline_or_unknown
        alert_status: normal_or_alert_or_unconfigured_or_indeterminate
      communication_status_rule:
        source: device_status
        evaluated_at: request_datetime
        online: latest_received_atからestimated_interval_seconds以内
        offline: latest_received_atからestimated_interval_secondsを超過
        unknown: 未受信または受信間隔を推定できない
      alert_status_rule:
        calculation_value_priority:
          - latest_values.display_value
          - latest_values.raw_value
        lower_alert: value < lower_limit
        upper_alert: value > upper_limit
        normal: 比較可能な全カラムが全閾値の範囲内
        unconfigured: 比較可能なカラムに閾値設定がない
        indeterminate: 閾値設定はあるが比較可能な数値がない
        client_fallback: alert_statusが未提供または固定値の場合、GET /thresholds と latest_values から再計算し、正常・上限超過・下限超過・上下限超過・閾値未設定・判定不能のいずれかを表示する

    - id: get_device
      method: GET
      path: /devices/{device_id}
      allowed_roles:
        - system_admin
        - company_admin
        - site_admin
        - general_user
      path_params:
        device_id: string
      response:
        id: integer
        company: integer
        company_name: string
        site: integer
        site_name: string
        device_id: string
        device_name: string
        auth_id: string
        input_type: json_or_csv
        csv_header_mode: header_exists_or_no_header
        status: active_or_inactive
        columns:
          - id: integer
            device: integer
            column_name: string
            display_name: string
            data_type: number_or_string_or_boolean
            unit: string
            weight: decimal_string
            display_order: integer
        created_at: datetime
        updated_at: datetime

    - id: create_device
      method: POST
      path: /devices
      allowed_roles:
        - system_admin
        - company_admin
        - site_admin
      request:
        company: integer
        site: integer
        device_name: string
        device_id: string
        auth_id: string
        auth_password: string
        input_type: json_or_csv
        csv_header_mode: header_exists_or_no_header
        columns:
          - column_name: string
            display_name: string
            data_type: number_or_string_or_boolean
            unit: string
            weight: number
            display_order: integer
      request_rules:
        csv_header_mode_required: true
        csv_header_mode_nullable: false
        json_input_type_csv_header_mode_default: header_exists
      response:
        id: integer
        company: integer
        company_name: string
        site: integer
        site_name: string
        device_id: string
        device_name: string
        auth_id: string
        input_type: json_or_csv
        csv_header_mode: header_exists_or_no_header
        status: active_or_inactive
        columns:
          - id: integer
            device: integer
            column_name: string
            display_name: string
            data_type: number_or_string_or_boolean
            unit: string
            weight: decimal_string
            display_order: integer
        created_at: datetime
        updated_at: datetime

    - id: update_device
      method: PUT
      path: /devices/{device_id}
      allowed_roles:
        - system_admin
        - company_admin
        - site_admin
      path_params:
        device_id: string
      request:
        company: integer
        site: integer
        device_name: string
        auth_id: string
        auth_password: optional_string
        input_type: json_or_csv
        csv_header_mode: header_exists_or_no_header
        columns:
          - column_name: string
            display_name: string
            data_type: number_or_string_or_boolean
            unit: string
            weight: number
            display_order: integer
      request_rules:
        csv_header_mode_required: true
        csv_header_mode_nullable: false
        json_input_type_csv_header_mode_default: header_exists
      immutable_fields:
        - device_id
      response:
        id: integer
        company: integer
        company_name: string
        site: integer
        site_name: string
        device_id: string
        device_name: string
        auth_id: string
        input_type: json_or_csv
        csv_header_mode: header_exists_or_no_header
        status: active_or_inactive
        columns:
          - id: integer
            device: integer
            column_name: string
            display_name: string
            data_type: number_or_string_or_boolean
            unit: string
            weight: decimal_string
            display_order: integer
        created_at: datetime
        updated_at: datetime

    - id: disable_device
      method: POST
      path: /devices/{device_id}/disable
      allowed_roles:
        - system_admin
        - company_admin
        - site_admin
      path_params:
        device_id: string

    - id: get_device_columns
      method: GET
      path: /devices/{device_id}/columns
      allowed_roles:
        - system_admin
        - company_admin
        - site_admin
        - general_user
      path_params:
        device_id: string
      response:
        - id: integer
          device: integer
          column_name: string
          display_name: string
          data_type: number_or_string_or_boolean
          unit: string
          weight: decimal_string
          display_order: integer

    - id: get_device_graph
      method: GET
      path: /devices/{device_id}/graph
      allowed_roles:
        - system_admin
        - company_admin
        - site_admin
        - general_user
      path_params:
        device_id: string
      query:
        from: optional_datetime
        to: optional_datetime
        column_name: optional_string
      query_rules:
        preset_period_from: current_datetime_minus_selected_period
        preset_period_to: current_datetime
        time_series_from: selected_start_date_start_of_day
        time_series_to: selected_end_date_end_of_day
        time_series_reload_trigger: click_display_button
        range_inclusion: from_and_to_inclusive
      response:
        device_id: string
        points:
          - device_timestamp: datetime
            server_timestamp: datetime
            column_name: string
            raw_value: number_or_string_or_boolean
            display_value: number_or_string_or_boolean
            is_valid: boolean
      response_rules:
        point_order: device_timestamp_ascending
        threshold_status_value: 最後のis_valid=trueのdisplay_valueを使用し、なければlatest_valuesへフォールバックする

  # ===========================================================================
  # 09. THRESHOLD API
  # ===========================================================================

  threshold_api:
    - id: list_thresholds
      method: GET
      path: /thresholds
      allowed_roles:
        - system_admin
        - company_admin
        - site_admin
        - general_user
      purpose: 閾値設定画面およびデバイスグラフの閾値線表示に使用する読取API
      authorization_rule: general_userは自身の企業・現場・デバイスに属する閾値のみ参照可能
      query:
        company_id: optional_integer
        site_id: optional_integer
        device_id: optional_string
        column_name: optional_string
      query_rules:
        device_id: デバイス管理IDを指定し、閾値設定画面ではカラム選択より先に選択する
      response:
        id: integer
        company: integer
        company_name: string
        site: integer
        site_name: string
        device: integer
        device_name: string
        column_name: string
        column_display_name: string
        threshold_name: string
        lower_limit: decimal_string
        upper_limit: decimal_string
        notification_emails: string
        suppress_minutes: integer
        current_status: normal_or_alert
        created_at: datetime
        updated_at: datetime
      usage:
        device_graph: column_nameでデバイスカラムへ紐付け、上限値は赤、下限値は青の点線でグラフ表示する

    - id: create_threshold
      method: POST
      path: /thresholds
      allowed_roles:
        - system_admin
        - company_admin
        - site_admin
      request:
        company: integer
        site: integer
        device: integer
        column_name: string
        threshold_name: string
        lower_limit: nullable_number
        upper_limit: nullable_number
        notification_emails: string
        suppress_minutes: integer
      request_rules:
        device_field: デバイス管理ID(device_id)ではなくデバイスのDB主キー(id)を指定する
      response:
        id: integer
        company: integer
        company_name: string
        site: integer
        site_name: string
        device: integer
        device_name: string
        column_name: string
        column_display_name: string
        threshold_name: string
        lower_limit: decimal_string
        upper_limit: decimal_string
        notification_emails: string
        suppress_minutes: integer
        current_status: normal_or_alert
        created_at: datetime
        updated_at: datetime

    - id: update_threshold
      method: PUT
      path: /thresholds/{threshold_id}
      allowed_roles:
        - system_admin
        - company_admin
        - site_admin
      path_params:
        threshold_id: integer
      request:
        company: integer
        site: integer
        device: integer
        column_name: string
        threshold_name: string
        lower_limit: nullable_number
        upper_limit: nullable_number
        notification_emails: string
        suppress_minutes: integer
      request_rules:
        device_field: デバイス管理ID(device_id)ではなくデバイスのDB主キー(id)を指定する
      response:
        id: integer
        company: integer
        company_name: string
        site: integer
        site_name: string
        device: integer
        device_name: string
        column_name: string
        column_display_name: string
        threshold_name: string
        lower_limit: decimal_string
        upper_limit: decimal_string
        notification_emails: string
        suppress_minutes: integer
        current_status: normal_or_alert
        created_at: datetime
        updated_at: datetime

    - id: delete_threshold
      method: DELETE
      path: /thresholds/{threshold_id}
      allowed_roles:
        - system_admin
        - company_admin
        - site_admin
      path_params:
        threshold_id: integer

  # ===========================================================================
  # 10. DASHBOARD API
  # ===========================================================================

  dashboard_api:
    - id: dashboard_summary
      method: GET
      path: /dashboard/summary
      allowed_roles:
        - system_admin
        - company_admin
        - site_admin
        - general_user

  # ===========================================================================
  # 11. MASTER API
  # ===========================================================================

  master_api:
    - id: master_companies
      method: GET
      path: /masters/companies

    - id: master_sites
      method: GET
      path: /masters/sites

    - id: master_devices
      method: GET
      path: /masters/devices

  # ===========================================================================
  # 12. AUDIT LOG API
  # ===========================================================================

  audit_log_api:
    - id: list_audit_logs
      method: GET
      path: /audit-logs
      allowed_roles:
        - system_admin
        - company_admin
        - site_admin
      query:
        company_id: optional_integer
        site_id: optional_integer
      response:
        id: integer
        created_at: datetime
        changed_by: nullable_integer_or_string
        changed_by_login_id: nullable_string
        action: string
        target_type: company_or_site_or_device_or_user_or_threshold_or_other
        target_id: nullable_integer_or_string
        target_display_name: nullable_string
        company_id: nullable_integer
        site_id: nullable_integer
        before_value: optional_object
        after_value: optional_object
      response_rules:
        changed_by_login_id: 操作ユーザーのlogin_idを返す
        target_display_name: target_typeに対応する企業名、現場名、デバイス名、ユーザー名などを返す
        created_at_format: ISO 8601。UI表示時にyyyy:MM:dd HH:mm:ssへ変換する

  # ===========================================================================
  # 13. AUTHORIZATION SCOPE RULES
  # ===========================================================================

  authorization_scope_rules:
    system_admin:
      company_scope: all
      site_scope: all
      device_scope: all

    company_admin:
      company_scope: own_company
      site_scope: own_company_sites
      device_scope: own_company_devices

    site_admin:
      company_scope: own_company
      site_scope: own_site
      device_scope: own_site_devices

    general_user:
      company_scope: own_company
      site_scope: own_site
      device_scope: own_site_devices
      write_permission: false

  # ===========================================================================
  # 14. REFERENCES
  # ===========================================================================

  references:
    overall_spec: 01_overall_spec.yaml
    data_spec: 02_data_spec.yaml
    ui_spec: 03_ui_spec.yaml
    infra_spec: 05_infra_spec.yaml
