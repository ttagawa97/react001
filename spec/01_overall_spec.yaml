# =============================================================================
# IoT Platform Overall Specification
# =============================================================================
#
# File Name:
#   01_overall_spec.yaml
#
# Spec Version:
#   2.2.0
#
# Last Updated:
#   2026-06-15
#
# Revision:
#   - 企業マスタ管理画面を追加
#   - company_settings をシステム管理者専用メニューとして追加
#   - システム管理者のみ企業名の追加・変更・無効化を可能とする
#
# =============================================================================

overall_spec:

  # ===========================================================================
  # 01. METADATA
  # ===========================================================================

  metadata:
    system_name: iot_platform
    spec_version: 2.2.0
    document_type: overall_specification
    language: ja
    timezone: Asia/Tokyo

  # ===========================================================================
  # 02. SYSTEM OVERVIEW
  # ===========================================================================

  system_overview:
    purpose: >
      モバイル回線を利用したIoTデバイスからデータを受信し、
      Web画面で一覧表示・グラフ表示・閾値監視を行う。

    architecture_style:
      - stateless_api
      - time_series_database
      - async_processing
      - multi_tenant

  # ===========================================================================
  # 03. BUSINESS HIERARCHY
  # ===========================================================================

  business_hierarchy:
    structure:
      company:
        child: site
      site:
        child: device
      device:
        child: device_column
      device_column:
        child: threshold

  # ===========================================================================
  # 04. USER ROLES
  # ===========================================================================

  user_roles:
    system_admin:
      label: システム管理者
      data_scope:
        companies: all
        sites: all
        devices: all
      permissions:
        - manage_companies
        - manage_sites
        - manage_users
        - manage_devices
        - manage_thresholds
        - view_audit_logs

    company_admin:
      label: 企業管理者
      data_scope:
        companies: own_company
        sites: all_sites_in_company
        devices: all_devices_in_company
      permissions:
        - manage_sites
        - manage_users
        - manage_devices
        - manage_thresholds
        - view_audit_logs

    site_admin:
      label: 現場管理者
      data_scope:
        companies: own_company
        sites: own_site
        devices: own_site_devices
      permissions:
        - manage_users
        - manage_devices
        - manage_thresholds
        - view_audit_logs

    general_user:
      label: 一般ユーザー
      data_scope:
        companies: own_company
        sites: own_site
        devices: own_site_devices
      permissions:
        - view_only

  # ===========================================================================
  # 05. MENU VISIBILITY
  # ===========================================================================

  menu_visibility:
    system_admin:
      - dashboard
      - devices
      - company_settings
      - site_settings
      - user_settings
      - device_settings
      - threshold_settings
      - audit_logs

    company_admin:
      - dashboard
      - devices
      - site_settings
      - user_settings
      - device_settings
      - threshold_settings
      - audit_logs

    site_admin:
      - dashboard
      - devices
      - user_settings
      - device_settings
      - threshold_settings
      - audit_logs

    general_user:
      - dashboard
      - devices

  # ===========================================================================
  # 06. COMPANY MANAGEMENT RULES
  # ===========================================================================

  company_management_rules:
    screen_id: company_settings
    label: 企業設定
    visible_roles:
      - system_admin

    editable_roles:
      - system_admin

    hidden_roles:
      - company_admin
      - site_admin
      - general_user

    actions:
      - list_companies
      - create_company
      - update_company
      - disable_company

    company_form_modal:
      usage:
        - create
        - update

      open_trigger:
        create:
          event: click_add_company_button
          mode: create

        update:
          event: double_click_company_table_row
          mode: update

      fields:
        - id: company_name
          label: 企業名
          type: Input
          required: true

        - id: status
          label: ステータス
          type: Select
          required: true
          options:
            - active
            - inactive

      validation:
        company_name_required: true
        company_name_unique: true

  # ===========================================================================
  # 07. COMMON FILTER POLICY
  # ===========================================================================

  common_filter_policy:
    visible_on_screens:
      - dashboard
      - devices
      - site_settings
      - user_settings
      - device_settings
      - threshold_settings
      - audit_logs
    hidden_on_screens:
      - login
      - password_reset
      - company_settings
      - device_graph

    fields:
      - company_id
      - site_id

    role_behavior:
      system_admin:
        company_id: editable
        site_id: editable

      company_admin:
        company_id: readonly
        site_id: editable

      site_admin:
        company_id: readonly
        site_id: readonly

      general_user:
        company_id: readonly
        site_id: readonly

  # ===========================================================================
  # 08. USER MANAGEMENT RULES
  # ===========================================================================

  user_management_rules:
    user_scope_rule:
      system_admin:
        company_id: nullable
        site_id: nullable
      company_admin:
        company_id: required
        site_id: nullable
      site_admin:
        company_id: required
        site_id: required
      general_user:
        company_id: required
        site_id: required

  # ===========================================================================
  # 09. DEVICE MANAGEMENT RULES
  # ===========================================================================

  device_management_rules:
    device_popup:
      mode:
        - create
        - update

    authentication:
      type: basic_auth
      https_only: true
      password_update_method: overwrite_allowed

    device_columns:
      min_count: 1
      max_count: 256
      fields:
        - column_name
        - display_name
        - data_type
        - unit
        - weight
        - display_order

  # ===========================================================================
  # 10. THRESHOLD RULES
  # ===========================================================================

  threshold_rules:
    target: device_column
    multiple_per_device: true
    multiple_per_column: true
    notification:
      method: email
      recipient_format: comma_separated_email_addresses
    error_data:
      exclude_from_threshold_check: true

    current_status:
      source_priority:
        device_list: latest_values_then_column_history
        device_graph: displayed_graph_last_valid_point_then_latest_values
      use_display_value: true
      result_labels:
        normal: 正常
        upper_exceeded: 上限超過
        lower_exceeded: 下限超過
        both_exceeded: 上下限超過
        no_threshold: 閾値未設定
        cannot_evaluate: 判定不能

  # ===========================================================================
  # 11. AUTHENTICATED SESSION RULES
  # ===========================================================================

  authenticated_session_rules:
    storage_scope: browser_tab
    storage: sessionStorage
    token_key: iot_platform_auth_token
    user_key: iot_platform_auth_user
    persisted_user_fields:
      - login_id
      - role_id
      - company_id
      - site_id
    reload_behavior:
      restore_without_login: true
      restore_initial_data: true
      expired_jwt: clear_session_and_show_login
      invalid_session: clear_session_and_show_login
    logout_behavior:
      call_logout_api: true
      clear_token: true
      clear_user_profile: true
      navigate_to: login

  # ===========================================================================
  # 12. FRONTEND IMPLEMENTATION CONTRACT
  # ===========================================================================

  frontend_implementation_contract:
    framework: React
    language: JavaScript_ES_modules
    build_tool: Vite
    ui_library: Chakra_UI_v2
    chart_library: Chart.js
    routing: state_based_single_page_navigation
    api_client: browser_fetch
    api_base_default: /api/v1
    api_base_environment_variable: VITE_API_BASE_PATH
    prototype_data_loading:
      implementation_status: current
      optional_api_fallback: src/data/store.js seed data
      empty_collection_fallback: seed data
      system_admin_initial_requests:
        - GET /companies
        - GET /sites
        - GET /devices
        - GET /devices/latest
        - GET /users
        - GET /thresholds
        - GET /audit-logs
      company_or_site_admin_initial_requests:
        - GET /masters/companies
        - GET /sites
        - GET /devices
        - GET /devices/latest
        - GET /users
        - GET /thresholds
        - GET /audit-logs
      general_user_initial_requests:
        - GET /masters/companies
        - GET /sites
        - GET /devices
        - GET /devices/latest
        - GET /thresholds
      dashboard_summary_endpoint_usage: not_currently_used
    visual_identity:
      product_name: Sensorix
      logo_asset: src/assets/sensorix_logo.png
      theme: dark
      logo_container_background: near_black
      main_background: dark_navy
      accents:
        - cyan
        - blue
        - orange

  # ===========================================================================
  # 13. AI IMPLEMENTATION RULES
  # ===========================================================================

  ai_implementation_rules:
    mandatory:
      - use_react
      - use_javascript_es_modules
      - use_chakra_ui
      - use_chartjs
      - use_django
      - use_drf
      - use_timescaledb
      - use_celery
      - use_redis
      - use_docker_compose

    prohibited:
      - websocket
      - auto_refresh
      - external_integration
      - search_function
      - data_discard

  # ===========================================================================
  # 14. PENDING ITEMS
  # ===========================================================================

  pending_items:
    - raw_data_retention_period
    - parsed_data_1min_retention_period
    - exact_downsampling_delete_timing
    - graph_range_to_table_mapping
    - performance_target_tps
    - availability_sla
    - backup_policy
    - disaster_recovery_policy
    - additional_security_controls
    - development_mail_server
    - aws_ses_region
    - aws_ses_verified_sender
    - production_secret_management
